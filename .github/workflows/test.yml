name: Full Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -efu -o pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends m4 make
          curl -fsSL 'https://git.io/shellspec' | sh -s -- --yes --prefix /usr/local
          ver=2.61 arc_name="yash-${ver}-linux-$(uname -m)"
          curl -fsSL "https://gitlab.com/qq542vev/build-yash/-/releases/${ver}/downloads/${arc_name}.tar.gz" \
            | tar -xzC / --strip-components=1 "${arc_name}/usr/local/bin/yash"
          ln -sf "$(command -v yash)" /usr/local/bin/sh

      - name: Run full test
        run: SHELL=yash make test TEST_FLAGS='--warning-as-failure'
        env:
          SHELL: yash
